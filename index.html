<script>
/* بديل محلي لواجهة window.storage الخاصة بمنصة Claude، يعمل عبر localStorage
   حتى يشتغل التطبيق بشكل مستقل بعد تحميله على أي جهاز/متصفح. */
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys };
  },
};
</script>

/* تحويل الأرقام الصينية (十二، مئة، إلخ) إلى رقم عربي */
const CHINESE_NUM_MAP = {
  "零": 0, "〇": 0, "一": 1, "二": 2, "两": 2, "三": 3, "四": 4, "五": 5,
  "六": 6, "七": 7, "八": 8, "九": 9, "十": 10, "百": 100, "千": 1000,
};
function chineseNumeralToInt(s) {
  if (!s) return null;
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  let section = 0;
  let num = 0;
  let matched = false;
  for (const ch of s) {
    const v = CHINESE_NUM_MAP[ch];
    if (v === undefined) return null;
    matched = true;
    if (v === 10 || v === 100 || v === 1000) {
      if (num === 0) num = 1;
      section += num * v;
      num = 0;
    } else {
      num = v;
    }
  }
  if (!matched) return null;
  const total = section + num;
  return total || null;
}

/* اكتشاف الفصول من نص صيني متصل (第X章 / 第X回 / 第X节 ...) مع حفظ كل النص بلا حذف */
const CHAPTER_LINE_RE = /^[\s　]*第\s*([0-9零〇一二三四五六七八九十百千两]+)\s*[章回节卷]\s*[:：、\-—.]?\s*(.*)$/;

function detectChapters(fullText) {
  const lines = (fullText || "").split(/\r?\n/);
  const markers = [];
  lines.forEach((line, idx) => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.length > 60) return; // عناوين الفصول عادة قصيرة، تجنّب مطابقات خاطئة داخل الحوار
    const m = trimmed.match(CHAPTER_LINE_RE);
    if (m) markers.push({ lineIndex: idx, number: chineseNumeralToInt(m[1]), title: (m[2] || "").trim() });
  });

  if (markers.length === 0) {
    const text = (fullText || "").trim();
    return text ? [{ number: 1, title: "", text }] : [];
  }

  const chapters = [];
  if (markers[0].lineIndex > 0) {
    const preface = lines.slice(0, markers[0].lineIndex).join("\n").trim();
    if (preface) chapters.push({ number: 0, title: "مقدمة", text: preface });
  }
  for (let i = 0; i < markers.length; i++) {
    const start = markers[i].lineIndex + 1;
    const end = i + 1 < markers.length ? markers[i + 1].lineIndex : lines.length;
    const body = lines.slice(start, end).join("\n").trim();
    if (body) chapters.push({ number: markers[i].number || i + 1, title: markers[i].title, text: body });
  }
  return chapters;
}

/* تقسيم نص طويل إلى مقاطع دون قطع فقرة أو جملة */
function splitLongParagraph(text, maxChars) {
  const sentences = text.split(/(?<=[。！？!?.])/);
  const parts = [];
  let cur = "";
  for (const s of sentences) {
    if (cur && (cur + s).length > maxChars) {
      parts.push(cur);
      cur = s;
    } else {
      cur += s;
    }
  }
  if (cur) parts.push(cur);
  return parts.length ? parts : [text];
}
function chunkText(text, maxChars = TRANSLATE_CHUNK_MAX_CHARS) {
  const paragraphs = (text || "").split(/\n+/).map((p) => p.trim()).filter(Boolean);
  const chunks = [];
  let current = "";
  for (const para of paragraphs) {
    const candidate = current ? current + "\n\n" + para : para;
    if (candidate.length > maxChars && current) {
      chunks.push(current);
      current = para;
    } else {
      current = candidate;
    }
    if (current.length > maxChars * 1.6) {
      const parts = splitLongParagraph(current, maxChars);
      chunks.push(...parts.slice(0, -1));
      current = parts[parts.length - 1] || "";
    }
  }
  if (current) chunks.push(current);
  return chunks.length ? chunks : text ? [text] : [];
}

/* استخراج نص PDF عبر pdf.js، مع تجميع القطع في أسطر حسب الإحداثي الرأسي */
async function extractPdfText(file, onProgress) {
  if (!window.pdfjsLib) throw new Error("تعذّر تحميل مكتبة قراءة PDF، تحقق من الاتصال بالإنترنت");
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let lastY = null;
    let lineBuf = "";
    const linesOut = [];
    for (const item of content.items) {
      const y = item.transform ? item.transform[5] : 0;
      if (lastY !== null && Math.abs(y - lastY) > 2) {
        linesOut.push(lineBuf);
        lineBuf = "";
      }
      lineBuf += item.str;
      lastY = y;
    }
    if (lineBuf) linesOut.push(lineBuf);
    fullText += linesOut.join("\n") + "\n";
    if (onProgress) onProgress(i, pdf.numPages);
    await sleep(0); // للسماح للواجهة بالتحديث وعدم التجميد
  }
  return fullText;
}

/* دمج قاموس المصطلحات: الأسبقية للمصطلح الذي تُرجم أولًا حتى لا يتغيّر لاحقًا */
function mergeGlossary(existing, newTerms) {
  const merged = { ...(existing || {}) };
  for (const t of newTerms || []) {
    if (t && t.source && t.arabic && !merged[t.source]) merged[t.source] = t.arabic;
  }
  return merged;
}
function glossaryAppendix(glossary) {
  const entries = Object.entries(glossary || {});
  if (!entries.length) return "";
  const lines = entries.slice(0, 400).map(([src, ar]) => `${src} = ${ar}`).join("\n");
  return "\n\nقائمة أسماء وأماكن ومصطلحات معتمدة سابقًا في هذه الرواية، التزم بترجمتها بنفس الشكل إذا تكررت:\n" + lines;
}

/* استدعاء خادم الترجمة الآمن (الذي يحمل مفتاح الـ API) */
async function callGeminiProxy(backendUrl, clientToken, payload) {
  if (!backendUrl) throw new Error("لم يتم إعداد رابط خادم الترجمة. أضفه من الإعدادات.");
  const headers = { "Content-Type": "application/json" };
  if (clientToken) headers["X-Client-Token"] = clientToken;
  let res;
  try {
    res = await fetch(backendUrl, { method: "POST", headers, body: JSON.stringify(payload) });
  } catch {
    throw new Error("تعذّر الاتصال بخادم الترجمة، تحقق من الإنترنت");
  }
  let data = null;
  try {
    data = await res.json();
  } catch {
    /* قد لا يوجد جسم JSON عند بعض الأخطاء */
  }
  if (!res.ok) throw new Error((data && data.error) || `فشل طلب الترجمة (${res.status})`);
  return data;
}

function extractGeminiText(data) {
  const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  return parts.map((p) => p.text || "").join("");
}

async function translateChunkWithRetry(text, glossary, backendUrl, clientToken, attempt = 1) {
  const systemInstruction = TRANSLATE_FIXED_PROMPT + glossaryAppendix(glossary);
  try {
    const data = await callGeminiProxy(backendUrl, clientToken, {
      model: GEMINI_MODEL,
      systemInstruction: { parts: [{ text: systemInstruction }] },
      contents: [{ role: "user", parts: [{ text }] }],
      generationConfig: { temperature: 0.25 },
    });
    const out = extractGeminiText(data).trim();
    if (!out) throw new Error("رد فارغ من نموذج الترجمة");
    return out;
  } catch (e) {
    if (attempt < 3) {
      await sleep(1000 * Math.pow(2, attempt));
      return translateChunkWithRetry(text, glossary, backendUrl, clientToken, attempt + 1);
    }
    throw e;
  }
}

async function extractGlossaryTerms(sourceExcerpt, backendUrl, clientToken) {
  if (!sourceExcerpt || !sourceExcerpt.trim()) return [];
  const data = await callGeminiProxy(backendUrl, clientToken, {
    model: GEMINI_MODEL,
    systemInstruction: { parts: [{ text: GLOSSARY_EXTRACT_PROMPT }] },
    contents: [{ role: "user", parts: [{ text: sourceExcerpt }] }],
    generationConfig: {
      temperature: 0,
      responseMimeType: "application/json",
      responseSchema: {
        type: "OBJECT",
        properties: {
          terms: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: { source: { type: "STRING" }, arabic: { type: "STRING" } },
              required: ["source", "arabic"],
            },
          },
        },
        required: ["terms"],
      },
    },
  });
  try {
    const parsed = JSON.parse(extractGeminiText(data));
    return Array.isArray(parsed.terms) ? parsed.terms : [];
  } catch {
    return [];
  }
}

function resizeImage(file, maxW = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("image load failed"));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* توقيت نسبي بالعربية، تقريبي وكافٍ لعرض "آخر قراءة" */
function formatRelativeAr(ts) {
  if (!ts) return "";
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff / 60000);
  const countPhrase = (n, singular, dual, plural) => {
    if (n <= 0) return `${singular === "دقيقة" ? "أقل من دقيقة" : "الآن"}`;
    if (n === 1) return `منذ ${singular}`;
    if (n === 2) return `منذ ${dual}`;
    if (n >= 3 && n <= 10) return `منذ ${n} ${plural}`;
    return `منذ ${n} ${singular}`;
  };
  if (min < 1) return "الآن";
  if (min < 60) return countPhrase(min, "دقيقة", "دقيقتين", "دقائق");
  const hr = Math.floor(min / 60);
  if (hr < 24) return countPhrase(hr, "ساعة", "ساعتين", "ساعات");
  const day = Math.floor(hr / 24);
  if (day < 30) return countPhrase(day, "يوم", "يومين", "أيام");
  const month = Math.floor(day / 30);
  if (month < 12) return countPhrase(month, "شهر", "شهرين", "أشهر");
  const year = Math.floor(month / 12);
  return countPhrase(year, "سنة", "سنتين", "سنوات");
}

function ChapterEditor({ initial, nextNumber, onBack, onSave }) {
  const [number, setNumber] = useState(initial ? initial.number : nextNumber);
  const [title, setTitle] = useState(initial ? initial.title || "" : "");
  const [content, setContent] = useState(initial ? initial.content || "" : "");
  const [savedFlash, setSavedFlash] = useState(false);
  const autoSaveTimer = useRef(null);
  const isEdit = !!initial;

  const doSave = useCallback(
    async (silent) => {
      await onSave({ number: Number(number) || 1, title: title.trim(), content });
      if (!silent) {
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 1200);
      }
    },
    [number, title, content, onSave]

  useEffect(() => {
    if (!isEdit) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);

      doSave(true);

              fontWeight: 700,
              cursor: "pointer",

      <div style={{ padding: "16px 18px 8px", display: "flex", gap: 10 }}>
        <input
          type="number"
          value={number}
          onChange={(e) => setNumber(e.target.value)}

            padding: "10px 10px",

/* ======================== صفحة القراءة (تمرير متواصل بين الفصول) ======================== */
function ReaderView({ novel, chapters, initialChapterId, initialOffset, onBack, onEditChapter, onSaveProgress }) {
  const sorted = useMemo(() => [...chapters].sort((a, b) => a.number - b.number), [chapters]);
  const chapterRefs = useRef({});
  const [currentChapterId, setCurrentChapterId] = useState(
    initialChapterId && sorted.some((c) => c.id === initialChapterId) ? initialChapterId : sorted[0]?.id || null
  );

  const sortedRef = useRef(sorted);
  sortedRef.current = sorted;
  const onSaveProgressRef = useRef(onSaveProgress);
  onSaveProgressRef.current = onSaveProgress;
  const currentInfoRef = useRef({ chapterId: currentChapterId, offset: initialOffset || 0 });
  const didInitialScroll = useRef(false);

  /* التمرير التلقائي إلى موضع القراءة المحفوظ عند فتح الصفحة */
  useEffect(() => {
    if (didInitialScroll.current) return;
    if (!sorted.length) return;
    const targetId = initialChapterId && sorted.some((c) => c.id === initialChapterId) ? initialChapterId : sorted[0].id;
    let raf1 = requestAnimationFrame(() => {
      const raf2 = requestAnimationFrame(() => {
        const node = chapterRefs.current[targetId];
        if (node) {
          const top = node.offsetTop + (initialOffset || 0);
          window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
        }
        didInitialScroll.current = true;
      });
      raf1 = raf2;
    });
    return () => cancelAnimationFrame(raf1);
  }, [sorted, initialChapterId, initialOffset]);

  function computeCurrentChapter() {
    const list = sortedRef.current;
    let found = list[0] || null;
    for (const c of list) {
      const node = chapterRefs.current[c.id];
      if (!node) continue;
      if (node.offsetTop <= window.scrollY + 96) {
        found = c;
      } else {
        break;
      }
    }
    return found;
  }

  function persistNow() {
    const info = currentInfoRef.current;
    if (!info.chapterId) return;
    const chapObj = sortedRef.current.find((c) => c.id === info.chapterId);
    if (!chapObj) return;
    onSaveProgressRef.current({
      chapterId: chapObj.id,
      chapterNumber: chapObj.number,
      chapterTitle: chapObj.title || "",
      scrollOffset: info.offset,
      updatedAt: Date.now(),
    });
  }

  /* حفظ موضع القراءة أثناء التمرير، وليس فقط عند الخروج */
  useEffect(() => {
    let saveTimer = null;
    function handleScroll() {
      if (!didInitialScroll.current) return;
      const cur = computeCurrentChapter();
      if (cur) {
        const node = chapterRefs.current[cur.id];
        const offset = node ? Math.max(0, Math.round(window.scrollY - node.offsetTop)) : 0;
        currentInfoRef.current = { chapterId: cur.id, offset };
        setCurrentChapterId((prev) => (prev === cur.id ? prev : cur.id));
      }
      if (saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(persistNow, 700);
    }
    function handleVisibility() {
      if (document.visibilityState === "hidden") persistNow();
    }
    window.addEventListener("scroll", handleScroll, { passive: true });
    document.addEventListener("visibilitychange", handleVisibility);
    window.addEventListener("pagehide", persistNow);
    const interval = setInterval(persistNow, 4000);
    return () => {
      window.removeEventListener("scroll", handleScroll);
      document.removeEventListener("visibilitychange", handleVisibility);
      window.removeEventListener("pagehide", persistNow);
      if (saveTimer) clearTimeout(saveTimer);
      clearInterval(interval);
      persistNow();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const currentChapter = sorted.find((c) => c.id === currentChapterId) || sorted[0];

  return (
    <div style={{ minHeight: "100vh", paddingBottom: 60 }}>
      <TopBar
        title={novel.title}
        subtitle={currentChapter ? chapterLabel(currentChapter) : ""}
        onBack={onBack}
        actions={
          currentChapter ? (
            <button
              onClick={() => onEditChapter(currentChapter.id)}
              aria-label="تعديل هذا الفصل"
              style={{ background: "transparent", border: "none", color: "#d4af37", cursor: "pointer", padding: 4 }}
            >
              <Pencil size={18} />
            </button>
          ) : null
        }
      />

      {sorted.length === 0 ? (
        <p style={{ color: "#7a4a39", fontSize: 14, marginTop: 60, textAlign: "center" }}>
          لا توجد فصول بعد
        </p>
      ) : (
        sorted.map((c, idx) => (
          <Fragment key={c.id}>
            <div ref={(el) => { chapterRefs.current[c.id] = el; }}>
              <div
                style={{
                  margin: "34px 20px 18px",
                  paddingBottom: 14,
                  textAlign: "center",
                }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, transparent, #4a2e21)" }} />
                  <OrnamentBead size={13} style={{ flexShrink: 0 }} />
                  <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, #4a2e21, transparent)" }} />
                </div>
                <span style={{ fontSize: 14, color: "#d4af37", fontWeight: 700, letterSpacing: 0.5 }}>
                  「{chapterLabel(c)}」
                </span>
              </div>
              <div
                dir="auto"
                style={{
                  padding: "4px 20px 10px",
                  color: "#ece1c9",
                  fontSize: 17,
                  lineHeight: 2.1,
                  fontFamily: "Georgia, 'Traditional Arabic', 'Noto Naskh Arabic', serif",
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                }}
              >
                {c.content && c.content.trim() ? c.content : (
                  <span style={{ color: "#7a4a39", fontStyle: "italic" }}>لا يوجد محتوى بعد لهذا الفصل</span>
                )}
              </div>
            </div>
            {idx < sorted.length - 1 && (
              <ChapterTransitionCard prevChapter={c} nextChapter={sorted[idx + 1]} />
            )}
          </Fragment>
        ))
      )}
    </div>
  );
}

/* ======================== السجل (تبويب رئيسي) ======================== */
function HistoryView({ entries, loadingMore, onOpenDetail, onContinueReading }) {
  const lastTapRef = useRef({});
  const pendingTimerRef = useRef({});

  useEffect(() => {
    return () => {
      Object.values(pendingTimerRef.current).forEach((t) => clearTimeout(t));
    };
  }, []);

  function handleTap(entry) {
    const key = entry.novelId;
    const now = Date.now();
    const last = lastTapRef.current[key] || 0;
    if (now - last < 320) {
      lastTapRef.current[key] = 0;
      if (pendingTimerRef.current[key]) {
        clearTimeout(pendingTimerRef.current[key]);
        delete pendingTimerRef.current[key];
      }
      onContinueReading(entry);
    } else {
      lastTapRef.current[key] = now;
      pendingTimerRef.current[key] = setTimeout(() => {
        if (lastTapRef.current[key] === now) {
          onOpenDetail(entry);
        }
      }, 330);
    }
  }

  return (
    <div>
      <TopBar title="السجل" />
      <div style={{ padding: "8px 16px 130px" }}>
        {entries.length === 0 ? (
          <div style={{ textAlign: "center", marginTop: "22vh", color: "#a8815a" }}>
            <Clock size={40} style={{ opacity: 0.5, marginBottom: 14 }} />
            <p style={{ fontSize: 15, margin: 0 }}>
              {loadingMore ? "جارٍ التحميل..." : "لا يوجد سجل قراءة بعد"}
            </p>
            {!loadingMore && (
              <p style={{ fontSize: 13, margin: "6px 0 0", color: "#7a4a39" }}>
                ابدأ بقراءة فصل من مكتبتك ليظهر هنا
              </p>
            )}
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>
            {entries.map((entry) => (
              <button
                key={entry.novelId}
                onClick={() => handleTap(entry)}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 14,
                  background: "#1a1210",
                  border: "1px solid #241715",
                  borderRadius: 12,
                  padding: 12,
                  cursor: "pointer",
                  textAlign: "right",
                }}
              >
                <div
                  style={{
                    width: 52,
                    height: 74,
                    borderRadius: 8,
                    overflow: "hidden",
                    background: "#221513",
                    border: "1px solid #2c1c17",
                    flexShrink: 0,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                  }}
                >
                  {entry.novel.cover ? (
                    <img src={entry.novel.cover} alt={entry.novel.title} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                  ) : (
                    <ImageIcon size={20} color="#5c3a2d" />
                  )}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div
                    style={{
                      color: "#f0e6d2",
                      fontSize: 14.5,
                      fontWeight: 600,
                      whiteSpace: "nowrap",
                      overflow: "hidden",
                      textOverflow: "ellipsis",
                    }}
                  >
                    {entry.novel.title}
                  </div>
                  <div style={{ color: "#a8815a", fontSize: 12.5, marginTop: 4 }}>
                    {chapterLabel({ number: entry.progress.chapterNumber, title: entry.progress.chapterTitle })}
                  </div>
                  <div style={{ color: "#7a4a39", fontSize: 11.5, marginTop: 3 }}>
                    {formatRelativeAr(entry.progress.updatedAt)}
                  </div>
                </div>
              </button>
            ))}
            <p style={{ textAlign: "center", color: "#7a4a39", fontSize: 11.5, marginTop: 4 }}>
              ضغطة واحدة لعرض التفاصيل، وضغطتان متتاليتان للمتابعة مباشرة
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

/* ======================== الترجمة: عناصر مساعدة للعرض ======================== */
function jobStatusLabel(job) {
  if (!job) return "";
  if (job.status === "done") return `اكتملت — ${job.totalChapters || 0} فصل`;
  if (job.status === "paused") return "متوقفة — بانتظار المتابعة";
  if (job.status === "error") return job.lastError || "حدث خطأ";
  if (job.status === "extracting") return "جارٍ استخراج النص من الملف...";
  return `جارٍ الترجمة — الفصل ${(job.currentChapterIndex || 0) + 1} من ${job.totalChapters || "؟"}`;
}
function statusIconFor(status) {
  if (status === "done") return <Check size={17} color="#d4af37" />;
  if (status === "paused" || status === "error") return <AlertTriangle size={16} color="#e2776a" />;
  return <Globe size={16} color="#a8815a" />;
}
function formatFileSize(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return `${bytes} بايت`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} كيلوبايت`;
  return `${(bytes / (1024 * 1024)).toFixed(1)} ميغابايت`;
}

};

/* ======================== الترجمة: صفحة مهمة ترجمة (تقدّم + فصول) ======================== */
function TranslationJobView({ job, onBack, onResume, onAddToLibrary, onSaveChapterEdit }) {
  const [openChapter, setOpenChapter] = useState(null);
  const [drafts, setDrafts] = useState({});
  const [copiedId, setCopiedId] = useState(null);

  if (!job) return null;

  const chapters = job.chapters || [];
  const totalCount = job.totalChapters || chapters.length || 0;
  const isRunning = job.status === "translating" || job.status === "extracting";
  const currentChapter = chapters[job.currentChapterIndex || 0];
  const chunkTotal = (currentChapter && currentChapter.chunks && currentChapter.chunks.length) || 0;
  const chunkDone = (currentChapter && currentChapter.chunkIndex) || 0;
  const percent = totalCount
    ? Math.min(100, Math.round((((job.currentChapterIndex || 0) + (chunkTotal ? chunkDone / chunkTotal : 0)) / totalCount) * 100))
    : 0;

  function handleCopy(text, id) {
    if (!navigator.clipboard) return;
    navigator.clipboard
      .writeText(text)
      .then(() => {
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 1500);
      })
      .catch(() => {});
  }

  function downloadText(filename, text) {
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function handleExportChapterFile(c, text) {
    downloadText(`${job.novelTitle}-الفصل-${c.index + 1}.txt`, `${c.translatedTitle || c.sourceTitle || ""}\n\n${text}`);
  }

  function handleExportAllFile() {
    const text = chapters
      .map((c) => `${c.translatedTitle || c.sourceTitle || `الفصل ${c.index + 1}`}\n\n${c.translatedText || ""}`)
      .join("\n\n---\n\n");
    downloadText(`${job.novelTitle}.txt`, text);
  }

  return (
    <div>
      <TopBar title={job.novelTitle} subtitle={jobStatusLabel(job)} onBack={onBack} />
      <div style={{ padding: "16px 16px 150px" }}>
        {isRunning && (
          <div style={{ background: "#1a1210", border: "1px solid #241715", borderRadius: 12, padding: "16px 16px", marginBottom: 16 }}>
            <p style={{ margin: "0 0 10px", color: "#f0e6d2", fontSize: 13.5 }}>
              {job.status === "extracting"
                ? "جارٍ استخراج نص الملف..."
                : `جاري ترجمة الفصل ${(job.currentChapterIndex || 0) + 1} من ${totalCount}...`}
            </p>
            <div style={{ height: 8, borderRadius: 6, background: "#241715", overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${percent}%`, background: "#d4af37", transition: "width .3s" }} />
            </div>
            <p style={{ margin: "8px 0 0", color: "#a8815a", fontSize: 12, textAlign: "left" }}>{percent}%</p>
          </div>
        )}

        {(job.status === "paused" || job.status === "error") && (
          <div style={{ background: "#241715", border: "1px solid #4a2420", borderRadius: 12, padding: "14px 16px", marginBottom: 16 }}>
            <p style={{ margin: "0 0 4px", color: "#e2776a", fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
              <AlertTriangle size={15} /> توقفت الترجمة
            </p>
            {job.lastError && <p style={{ margin: "0 0 10px", color: "#a8815a", fontSize: 12 }}>{job.lastError}</p>}
            <button
              onClick={onResume}
              style={{
                width: "100%",
                padding: "11px 0",
                borderRadius: 10,
                border: "none",
                background: "#d4af37",
                color: "#130d0c",
                fontSize: 14,
                fontWeight: 700,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 8,
                cursor: "pointer",
              }}
            >
              <RefreshCw size={15} /> متابعة الترجمة
            </button>
          </div>
        )}

        {job.status === "done" && (
          <button
            onClick={onAddToLibrary}
            disabled={!!job.addedToLibraryNovelId}
            style={{
              width: "100%",
              padding: "13px 0",
              borderRadius: 10,
              border: "none",
              marginBottom: 12,
              background: job.addedToLibraryNovelId ? "#3d241f" : "#d4af37",
              color: job.addedToLibraryNovelId ? "#a8815a" : "#130d0c",
              fontSize: 14.5,
              fontWeight: 700,
              cursor: job.addedToLibraryNovelId ? "default" : "pointer",
            }}
          >
            {job.addedToLibraryNovelId ? "أُضيفت إلى مكتبتي" : "إضافة إلى مكتبتي"}
          </button>
        )}

        {chapters.some((c) => c.status === "done") && (
          <button
            onClick={handleExportAllFile}
            style={{
              width: "100%",
              padding: "11px 0",
              borderRadius: 10,
              border: "1px solid #3d241f",
              background: "transparent",
              color: "#cbb896",
              fontSize: 13,
              marginBottom: 16,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 8,
              cursor: "pointer",
            }}
          >
            <Download size={15} /> تصدير كل الفصول
          </button>
        )}

        {chapters.map((c) => {
          const isOpen = openChapter === c.index;
          const draft = drafts[c.index] !== undefined ? drafts[c.index] : c.translatedText || "";
          const label =
            c.translatedTitle || c.sourceTitle ? `الفصل ${c.index + 1} — ${c.translatedTitle || c.sourceTitle}` : `الفصل ${c.index + 1}`;
          return (
            <div key={c.index} style={{ background: "#1a1210", border: "1px solid #241715", borderRadius: 12, marginBottom: 10, overflow: "hidden" }}>
              <button
                onClick={() => c.status === "done" && setOpenChapter(isOpen ? null : c.index)}
                style={{
                  width: "100%",
                  padding: "13px 14px",
                  background: "transparent",
                  border: "none",
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  cursor: c.status === "done" ? "pointer" : "default",
                  textAlign: "right",
                }}
              >
                <span style={{ flex: 1, color: "#f0e6d2", fontSize: 13.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  {label}
                </span>
                {c.status === "done" ? (
                  <ChevronDown size={16} color="#a8815a" style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .2s" }} />
                ) : c.status === "translating" ? (
                  <span style={{ color: "#a8815a", fontSize: 11.5 }}>جارٍ الترجمة...</span>
                ) : (
                  <span style={{ color: "#7a4a39", fontSize: 11.5 }}>بالانتظار</span>

              </button>

              {isOpen && (
                <div style={{ padding: "0 14px 14px" }}>
                  <textarea
                    value={draft}
                    onChange={(e) => setDrafts((prev) => ({ ...prev, [c.index]: e.target.value }))}

                    style={{
                      width: "100%",
                      minHeight: 180,
                      padding: "11px 12px",

                      border: "1px solid #3d241f",

                      color: "#f0e6d2",

                      lineHeight: 1.9,

                      resize: "vertical",
                    }}
                  />
                  <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                    <button onClick={() => handleCopy(draft, c.index)} style={smallBtnStyle}>
                      <Copy size={14} /> {copiedId === c.index ? "تم النسخ" : "نسخ"}
                    </button>
                    <button onClick={() => onSaveChapterEdit(c.index, draft)} style={smallBtnStyle}>
                      <Check size={14} /> حفظ
                    </button>
                    <button onClick={() => handleExportChapterFile(c, draft)} style={smallBtnStyle}>
                      <Download size={14} /> تصدير
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ======================== التطبيق الرئيسي ======================== */
function App() {
  const [loading, setLoading] = useState(true);
  const [novels, setNovels] = useState([]);
  const [chaptersCache, setChaptersCache] = useState({});
  const [novelProgress, setNovelProgress] = useState({});
  const [historyOrder, setHistoryOrder] = useState([]);
  const [view, setView] = useState("library");
  const [currentNovelId, setCurrentNovelId] = useState(null);
  const [currentChapterId, setCurrentChapterId] = useState(null);
  const [readerTarget, setReaderTarget] = useState({ chapterId: null, offset: 0 });
  const [editorReturnView, setEditorReturnView] = useState("novel");
  const [translateConfig, setTranslateConfig] = useState({ backendUrl: "", clientToken: "" });
  const [translateJobsIndex, setTranslateJobsIndex] = useState([]);
  const [activeJob, setActiveJob] = useState(null);
  const [currentTranslateJobId, setCurrentTranslateJobId] = useState(null);
  const runningJobIdRef = useRef(null);

  useEffect(() => {
    (async () => {
      const [n, order, tCfg, tJobs] = await Promise.all([
        loadNovels(),
        loadHistoryOrder(),
        loadTranslateConfig(),
        loadTranslateJobsIndex(),
      ]);
      setNovels(n);
      setHistoryOrder(order.filter((id) => n.some((nv) => nv.id === id)));
      setTranslateConfig(tCfg);
      setTranslateJobsIndex(tJobs);
      setLoading(false);
    })();
  }, []);

  /* حماية من الانتقال لصفحات تعتمد على بيانات محذوفة (رواية/فصل حُذف من مكان آخر) */
  useEffect(() => {
    if (loading) return;
    const novelDependentViews = ["novel", "reader", "addChapter", "editChapter", "historyDetail"];
    if (novelDependentViews.includes(view) && currentNovelId && !novels.some((n) => n.id === currentNovelId)) {
      setView("library");
    }
    if (view === "translateJob" && !activeJob) {
      setView("translate");
    }
  }, [loading, view, novels, currentNovelId, activeJob]);

  async function openNovel(id) {
    setCurrentNovelId(id);
    const tasks = [];
    if (!chaptersCache[id]) {
      tasks.push(loadChapters(id).then((ch) => setChaptersCache((prev) => ({ ...prev, [id]: ch }))));
    }
    if (!(id in novelProgress)) {
      tasks.push(loadProgress(id).then((p) => setNovelProgress((prev) => ({ ...prev, [id]: p }))));
    }
    if (tasks.length) await Promise.all(tasks);
    setView("novel");
  }

  async function openReaderFor(novelId, chapterId, offset) {
    setCurrentNovelId(novelId);
    if (!chaptersCache[novelId]) {
      const ch = await loadChapters(novelId);
      setChaptersCache((prev) => ({ ...prev, [novelId]: ch }));
    }
    setReaderTarget({ chapterId: chapterId || null, offset: offset || 0 });
    setView("reader");
  }

  async function handleAddNovel({ title, cover }) {
    const novel = { id: uid(), title, cover, createdAt: Date.now() };
    const updated = [novel, ...novels];
    setNovels(updated);
    await saveNovels(updated);
    setView("library");
  }

  async function handleDeleteNovel(id) {
    const updated = novels.filter((n) => n.id !== id);
    setNovels(updated);
    await saveNovels(updated);
    await deleteChaptersKey(id);
    await deleteProgressKey(id);
    setChaptersCache((prev) => {
      const c = { ...prev };
      delete c[id];
      return c;
    });
    setNovelProgress((prev) => {
      const c = { ...prev };
      delete c[id];
      return c;
    });
    setHistoryOrder((prev) => {
      const next = prev.filter((x) => x !== id);
      saveHistoryOrder(next);
      return next;
    });
  }

  async function handleAddChapter({ number, title, content }) {
    const list = chaptersCache[currentNovelId] || [];
    const chapter = { id: uid(), number, title, content, updatedAt: Date.now() };
    const updated = [...list, chapter];
    setChaptersCache((prev) => ({ ...prev, [currentNovelId]: updated }));
    await saveChapters(currentNovelId, updated);
    setView("novel");
  }

  async function handleUpdateChapter(chapterId, { number, title, content }) {
    const list = chaptersCache[currentNovelId] || [];
    const updated = list.map((c) =>
      c.id === chapterId ? { ...c, number, title, content, updatedAt: Date.now() } : c
    );
    setChaptersCache((prev) => ({ ...prev, [currentNovelId]: updated }));
    await saveChapters(currentNovelId, updated);
  }

  async function handleDeleteChapter(chapterId) {
    const list = chaptersCache[currentNovelId] || [];
    const updated = list.filter((c) => c.id !== chapterId);
    setChaptersCache((prev) => ({ ...prev, [currentNovelId]: updated }));
    await saveChapters(currentNovelId, updated);
  }

  async function handleSaveProgress(novelId, progressObj) {
    setNovelProgress((prev) => ({ ...prev, [novelId]: progressObj }));
    await saveProgressStorage(novelId, progressObj);
    setHistoryOrder((prev) => {
      const next = [novelId, ...prev.filter((id) => id !== novelId)].slice(0, 60);
      saveHistoryOrder(next);
      return next;
    });
  }

  async function refreshHistory() {
    const missing = historyOrder.filter((id) => !(id in novelProgress) && novels.some((n) => n.id === id));
    if (!missing.length) return;
    const entries = await Promise.all(missing.map(async (id) => [id, await loadProgress(id)]));
    setNovelProgress((prev) => {
      const next = { ...prev };
      entries.forEach(([id, p]) => {
        next[id] = p;
      });
      return next;
    });
  }

  function handleTabChange(tab) {
    if (tab === "history") refreshHistory();
    setCurrentChapterId(null);
    setView(tab);
  }

  function backFromEditor() {
    if (editorReturnView === "reader" && currentChapterId) {
      setReaderTarget({ chapterId: currentChapterId, offset: 0 });
    }
    setView(editorReturnView);
  }

  async function handleExportBackup() {
    const data = { novels, chaptersByNovel: {}, progressByNovel: {}, historyOrder, exportedAt: Date.now() };
    for (const n of novels) {
      data.chaptersByNovel[n.id] = chaptersCache[n.id] || (await loadChapters(n.id));
      data.progressByNovel[n.id] = novelProgress[n.id] !== undefined ? novelProgress[n.id] : await loadProgress(n.id);
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `مكتبتي-نسخة-احتياطية-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  async function handleImportBackup(file) {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.novels)) throw new Error("invalid backup");

      await saveNovels(data.novels);
      setNovels(data.novels);

      const newChaptersCache = {};
      for (const n of data.novels) {
        const chs = (data.chaptersByNovel && data.chaptersByNovel[n.id]) || [];
        await saveChapters(n.id, chs);
        newChaptersCache[n.id] = chs;
      }
      setChaptersCache(newChaptersCache);

      const newProgress = {};
      for (const n of data.novels) {
        const p = data.progressByNovel && data.progressByNovel[n.id];
        if (p) {
          await saveProgressStorage(n.id, p);
          newProgress[n.id] = p;
        }
      }
      setNovelProgress(newProgress);

      const order = Array.isArray(data.historyOrder)
        ? data.historyOrder.filter((id) => data.novels.some((n) => n.id === id))
        : [];
      await saveHistoryOrder(order);
      setHistoryOrder(order);

      setCurrentNovelId(null);
      setView("library");
      return true;
    } catch {
      return false;
    }
  }

  async function handleClearAll() {
    for (const n of novels) {
      await deleteChaptersKey(n.id);
      await deleteProgressKey(n.id);
    }
    await saveNovels([]);
    await saveHistoryOrder([]);
    setNovels([]);
    setChaptersCache({});
    setNovelProgress({});
    setHistoryOrder([]);
    setCurrentNovelId(null);
    setView("library");
  }

  /* ====================== منطق ميزة «الترجمة» ====================== */

  async function persistJob(jobObj) {
    const toSave = { ...jobObj };
    delete toSave._file;
    await saveTranslateJob(toSave);
    setTranslateJobsIndex((prev) => {
      const idx = prev.findIndex((j) => j.id === jobObj.id);
      const entry = {
        id: jobObj.id,
        novelTitle: jobObj.novelTitle,
        status: jobObj.status,
        totalChapters: jobObj.totalChapters || (jobObj.chapters ? jobObj.chapters.length : 0),
        currentChapterIndex: jobObj.currentChapterIndex || 0,
        lastError: jobObj.lastError || null,
        addedToLibraryNovelId: jobObj.addedToLibraryNovelId || null,
        createdAt: jobObj.createdAt,
        updatedAt: Date.now(),
      };
      const nextList = idx === -1 ? [entry, ...prev] : prev.map((j, i) => (i === idx ? entry : j));
      saveTranslateJobsIndex(nextList);
      return nextList;
    });
  }

  /* محرك الترجمة: يعمل في الخلفية بشكل مستقل عن الشاشة المعروضة حاليًا،
     ويُستأنف من آخر فصل غير مكتمل عند انقطاع الاتصال أو حدوث خطأ */
  async function runTranslationJob(initialJob, backendUrl, clientToken) {
    const jobId = initialJob.id;
    runningJobIdRef.current = jobId;
    let job = initialJob;

    async function checkSuperseded() {
      if (runningJobIdRef.current !== jobId) {
        if (job.status === "translating" || job.status === "extracting") {
          job = { ...job, status: "paused" };
          setActiveJob((prev) => (prev && prev.id === jobId ? job : prev));
          await persistJob(job);
        }
        return true;
      }
      return false;
    }

    try {
      if (!job.chapters || job.chapters.length === 0) {
        job = { ...job, status: "extracting" };
        setActiveJob(job);
        await persistJob(job);

        const fullText = await extractPdfText(job._file, () => {});
        const detected = detectChapters(fullText);
        const chapters = detected.map((c, i) => ({
          index: i,
          sourceTitle: c.title || "",
          translatedTitle: "",
          sourceText: c.text,
          translatedText: "",
          status: "pending",
          chunkIndex: 0,
          chunks: chunkText(c.text),
          glossaryChecked: false,
        }));
        job = {
          ...job,
          chapters,
          totalChapters: chapters.length,
          status: "translating",
          currentChapterIndex: 0,
          glossary: job.glossary || {},
        };
        delete job._file;
        setActiveJob(job);
        await persistJob(job);
      } else if (job.status !== "translating") {
        job = { ...job, status: "translating", lastError: null };
        setActiveJob(job);
        await persistJob(job);
      }

      for (let ci = job.currentChapterIndex || 0; ci < job.chapters.length; ci++) {
        if (await checkSuperseded()) return;
        let chapter = job.chapters[ci];
        if (chapter.status === "done") continue;

        chapter = { ...chapter, status: "translating" };
        job = { ...job, chapters: job.chapters.map((c, i) => (i === ci ? chapter : c)), currentChapterIndex: ci };
        setActiveJob(job);

        if (!chapter.glossaryChecked) {
          try {
            const terms = await extractGlossaryTerms(chapter.sourceText.slice(0, 12000), backendUrl, clientToken);
            job = { ...job, glossary: mergeGlossary(job.glossary || {}, terms) };
          } catch {
            /* غير حرج لسير العمل، نكمل بدون تحديث القاموس لهذا الفصل */
          }
          chapter = { ...chapter, glossaryChecked: true };
          job = { ...job, chapters: job.chapters.map((c, i) => (i === ci ? chapter : c)) };
          setActiveJob(job);
        }

        if (chapter.sourceTitle && !chapter.translatedTitle) {
          if (await checkSuperseded()) return;
          try {
            const translatedTitle = await translateChunkWithRetry(chapter.sourceTitle, job.glossary, backendUrl, clientToken);
            chapter = { ...chapter, translatedTitle };
          } catch (e) {
            job = { ...job, status: "paused", lastError: e.message || String(e) };
            setActiveJob(job);
            await persistJob(job);
            return;
          }
          job = { ...job, chapters: job.chapters.map((c, i) => (i === ci ? chapter : c)) };
          setActiveJob(job);
        }

        await persistJob(job); // نقطة استعادة عند بداية الفصل (بعد القاموس والعنوان)

        for (let chi = chapter.chunkIndex || 0; chi < chapter.chunks.length; chi++) {
          if (await checkSuperseded()) return;
          let translated;
          try {
            translated = await translateChunkWithRetry(chapter.chunks[chi], job.glossary, backendUrl, clientToken);
          } catch (e) {
            job = { ...job, status: "paused", lastError: e.message || String(e) };
            setActiveJob(job);
            await persistJob(job);
            return;
          }
          chapter = {
            ...chapter,
            translatedText: chapter.translatedText ? chapter.translatedText + "\n\n" + translated : translated,
            chunkIndex: chi + 1,
          };
          job = { ...job, chapters: job.chapters.map((c, i) => (i === ci ? chapter : c)) };
          setActiveJob(job); // تحديث حي للواجهة، بلا كتابة تخزين على كل مقطع لتفادي البطء
        }

        chapter = { ...chapter, status: "done" };
        job = { ...job, chapters: job.chapters.map((c, i) => (i === ci ? chapter : c)) };
        setActiveJob(job);
        await persistJob(job); // نقطة استعادة بعد اكتمال كل فصل
      }

      job = { ...job, status: "done" };
      setActiveJob(job);
      await persistJob(job);
    } catch (e) {
      job = { ...job, status: "paused", lastError: (e && e.message) || String(e) };
      setActiveJob(job);
      await persistJob(job);
    }
  }

  async function handleCreateTranslationJob({ title, file }) {
    const job = {
      id: uid(),
      novelTitle: title,
      fileName: file.name,
      fileSize: file.size,
      status: "extracting",
      chapters: [],
      totalChapters: 0,
      currentChapterIndex: 0,
      glossary: {},
      createdAt: Date.now(),
      addedToLibraryNovelId: null,
      lastError: null,
      _file: file,
    };
    setActiveJob(job);
    await persistJob(job);
    setCurrentTranslateJobId(job.id);
    setView("translateJob");
    runTranslationJob(job, translateConfig.backendUrl, translateConfig.clientToken);
  }

  async function openTranslateJob(jobId) {
    setCurrentTranslateJobId(jobId);
    if (!activeJob || activeJob.id !== jobId) {
      const j = await loadTranslateJob(jobId);
      setActiveJob(j);
    }
    setView("translateJob");
  }

  function handleResumeJob() {
    if (!activeJob) return;
    runTranslationJob(activeJob, translateConfig.backendUrl, translateConfig.clientToken);
  }

  async function handleSaveChapterEdit(chapterIndex, newText) {
    if (!activeJob) return;
    const updated = {
      ...activeJob,
      chapters: activeJob.chapters.map((c, i) => (i === chapterIndex ? { ...c, translatedText: newText } : c)),
    };
    setActiveJob(updated);
    await persistJob(updated);
  }

  async function handleAddJobToLibrary() {
    if (!activeJob || activeJob.addedToLibraryNovelId) return;
    const novel = { id: uid(), title: activeJob.novelTitle, cover: null, createdAt: Date.now() };
    const chaptersForLibrary = [...activeJob.chapters]
      .sort((a, b) => a.index - b.index)
      .map((c) => ({
        id: uid(),
        number: c.index + 1,
        title: c.translatedTitle || c.sourceTitle || "",
        content: c.translatedText || "",
        updatedAt: Date.now(),
      }));

    const updatedNovels = [novel, ...novels];
    setNovels(updatedNovels);
    await saveNovels(updatedNovels);
    await saveChapters(novel.id, chaptersForLibrary);
    setChaptersCache((prev) => ({ ...prev, [novel.id]: chaptersForLibrary }));

    const updatedJob = { ...activeJob, addedToLibraryNovelId: novel.id };
    setActiveJob(updatedJob);
    await persistJob(updatedJob);
  }

  async function handleDeleteTranslationJob(jobId) {
    if (runningJobIdRef.current === jobId) runningJobIdRef.current = null;
    await deleteTranslateJobKey(jobId);
    setTranslateJobsIndex((prev) => {
      const next = prev.filter((j) => j.id !== jobId);
      saveTranslateJobsIndex(next);
      return next;
    });
    if (currentTranslateJobId === jobId) {
      setActiveJob(null);
      setCurrentTranslateJobId(null);
    }
  }

  async function handleSaveTranslateConfig(cfg) {
    setTranslateConfig(cfg);
    await saveTranslateConfig(cfg);
  }

  const shell = {
    minHeight: "100vh",
    background: "#130d0c",
    fontFamily: "system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif",
    direction: "rtl",
    maxWidth: 480,
    margin: "0 auto",
    position: "relative",
    zIndex: 0,
  };

  if (loading) {
    return (
      <div style={{ ...shell, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ color: "#a8815a", fontSize: 14 }}>جارٍ التحميل...</span>
      </div>
    );
  }

  const currentNovel = novels.find((n) => n.id === currentNovelId);
  const currentChapters = chaptersCache[currentNovelId] || [];
  const currentChapter = currentChapters.find((c) => c.id === currentChapterId);
  const currentProgress = currentNovelId ? novelProgress[currentNovelId] : null;
  const nextNumber = currentChapters.length
    ? Math.max(...currentChapters.map((c) => c.number)) + 1
    : 1;

  const historyEntries = historyOrder
    .map((id) => {
      const novel = novels.find((n) => n.id === id);
      const progress = novelProgress[id];
      if (!novel || !progress) return null;
      return { novelId: id, novel, progress };
    })
    .filter(Boolean);
  const historyStillLoading = historyOrder.length > 0 && historyEntries.length === 0;

  const topLevelViews = ["library", "translate", "history", "settings"];

  return (
    <div style={shell}>
      <div
        aria-hidden="true"
        style={{
          position: "fixed",
          top: 0,
          left: "50%",
          transform: "translateX(-50%)",
          width: "100%",
          maxWidth: 480,
          height: "100%",
          zIndex: -1,
          pointerEvents: "none",
          overflow: "hidden",
        }}
      >
        <div
          style={{
            position: "absolute",
            top: -50,
            right: -30,
            width: 220,
            height: 220,
            borderRadius: "50%",
            background: "radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(212,175,55,0.04) 45%, transparent 72%)",
          }}
        />
        <CloudMotif width={230} height={115} color="#241715" opacity={0.9} style={{ position: "absolute", bottom: 70, left: -40 }} />
        <CloudMotif width={170} height={85} color="#1f1512" opacity={0.9} style={{ position: "absolute", top: "40%", right: -45 }} />
      </div>

      {view === "library" && (
        <LibraryView
          novels={novels}
          onOpenNovel={openNovel}
          onAddNovel={() => setView("addNovel")}
          onDeleteNovel={handleDeleteNovel}
        />
      )}

      {view === "history" && (
        <HistoryView
          entries={historyEntries}
          loadingMore={historyStillLoading}
          onOpenDetail={(entry) => {
            setCurrentNovelId(entry.novelId);
            setView("historyDetail");
          }}
          onContinueReading={(entry) => {
            openReaderFor(entry.novelId, entry.progress.chapterId, entry.progress.scrollOffset);
          }}
        />
      )}

      {view === "settings" && (
        <SettingsView
          novelsCount={novels.length}
          onExport={handleExportBackup}
          onImportFile={handleImportBackup}
          onClearAll={handleClearAll}
          translateConfig={translateConfig}
          onSaveTranslateConfig={handleSaveTranslateConfig}
        />
      )}

      {view === "translate" && (
        <TranslateHubView
          jobs={translateJobsIndex}
          onOpenJob={openTranslateJob}
          onNewJob={() => setView("translateNew")}
          onDeleteJob={handleDeleteTranslationJob}
          backendConfigured={!!translateConfig.backendUrl}
        />
      )}

      {view === "translateNew" && (
        <NewTranslationView
          onBack={() => setView("translate")}
          onCreate={handleCreateTranslationJob}
          backendConfigured={!!translateConfig.backendUrl}
        />
      )}

      {view === "translateJob" && activeJob && (
        <TranslationJobView
          job={activeJob}
          onBack={() => setView("translate")}
          onResume={handleResumeJob}
          onAddToLibrary={handleAddJobToLibrary}
          onSaveChapterEdit={handleSaveChapterEdit}
        />
      )}

      {view === "addNovel" && <AddNovelView onBack={() => setView("library")} onSave={handleAddNovel} />}

      {view === "novel" && currentNovel && (
        <NovelView
          novel={currentNovel}
          chapters={currentChapters}
          progress={currentProgress}
          onBack={() => setView("library")}
          onOpenReader={(chapterId) => openReaderFor(currentNovel.id, chapterId, 0)}
          onEditChapter={(chapterId) => {
            setCurrentChapterId(chapterId);
            setEditorReturnView("novel");
            setView("editChapter");
          }}
          onAddChapter={() => setView("addChapter")}
          onDeleteChapter={handleDeleteChapter}
          onContinueReading={() => {
            if (currentProgress) openReaderFor(currentNovel.id, currentProgress.chapterId, currentProgress.scrollOffset);
          }}
        />
      )}

      {view === "addChapter" && (
        <ChapterEditor
          initial={null}
          nextNumber={nextNumber}
          onBack={() => setView("novel")}
          onSave={handleAddChapter}
        />
      )}

      {view === "editChapter" && currentChapter && (
        <ChapterEditor
          initial={currentChapter}
          nextNumber={currentChapter.number}
          onBack={backFromEditor}
          onSave={(data) => handleUpdateChapter(currentChapter.id, data)}
        />
      )}

      {view === "reader" && currentNovel && (
        <ReaderView
          key={currentNovel.id}
          novel={currentNovel}
          chapters={currentChapters}
          initialChapterId={readerTarget.chapterId}
          initialOffset={readerTarget.offset}
          onBack={() => setView("novel")}
          onEditChapter={(chapterId) => {
            setCurrentChapterId(chapterId);
            setEditorReturnView("reader");
            setView("editChapter");
          }}
          onSaveProgress={(p) => handleSaveProgress(currentNovel.id, p)}
        />
      )}

      {view === "historyDetail" && currentNovel && currentProgress && (
        <HistoryDetailView
          novel={currentNovel}
          progress={currentProgress}
          onBack={() => setView("history")}
          onContinueReading={() => openReaderFor(currentNovel.id, currentProgress.chapterId, currentProgress.scrollOffset)}
          onOpenNovel={() => openNovel(currentNovel.id)}
        />
      )}

      {topLevelViews.includes(view) && <BottomNav active={view} onChange={handleTabChange} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  // تسجيل الـ Service Worker لتفعيل عمل التطبيق بدون إنترنت
  // (يعمل فقط عند تشغيل الموقع عبر https أو من جهاز محلي عبر خادم، وليس عبر فتح الملف مباشرة)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
