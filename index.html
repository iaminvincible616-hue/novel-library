<script>
/* بديل محلي لواجهة window.storage الخاصة بمنصة Claude، يعمل عبر localStorage
   حتى يشتغل التطبيق بشكل مستقل بعد تحميله على أي جهاز/متصفح. */
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys };
  },
};
</script>

<script type="text/babel" data-presets="react">

}

/* ========================================================================
   تخزين البيانات
   novels        -> [{ id, title, cover, createdAt }]
   chapters:<id> -> [{ id, number, title, content, updatedAt }]
   ======================================================================== */

async function loadNovels() {
  try {
    const res = await window.storage.get("novels");
    return res ? JSON.parse(res.value) : [];
  } catch {
    return [];
  }
}
async function saveNovels(novels) {
  try {
    await window.storage.set("novels", JSON.stringify(novels));
    return true;
  } catch {
    return false;
  }
}
async function loadChapters(novelId) {
  try {
    const res = await window.storage.get(`chapters:${novelId}`);
    return res ? JSON.parse(res.value) : [];
  } catch {
    return [];
  }
}
async function saveChapters(novelId, chapters) {
  try {
    await window.storage.set(`chapters:${novelId}`, JSON.stringify(chapters));
    return true;
  } catch {
    return false;
  }
}
async function deleteChaptersKey(novelId) {
  try {
    await window.storage.delete(`chapters:${novelId}`);
  } catch {
    /* ignore */
  }
}

function resizeImage(file, maxW = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("image load failed"));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ======================== إضافة رواية ======================== */
function AddNovelView({ onBack, onSave }) {
  const [title, setTitle] = useState("");
  const [cover, setCover] = useState(null);
  const [busy, setBusy] = useState(false);
  const fileRef = useRef(null);

  async function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImage(file);
      setCover(dataUrl);
    } catch {
      /* ignore */
    }
  }

  async function handleSave() {
    if (!title.trim() || busy) return;
    setBusy(true);
    await onSave({ title: title.trim(), cover });
    setBusy(false);
  }

  return (
    <div>
      <TopBar title="إضافة رواية" onBack={onBack} />
      <div style={{ padding: "24px 20px 60px", display: "flex", flexDirection: "column", alignItems: "center" }}>
        <button
          onClick={() => fileRef.current?.click()}
          style={{
            width: 160,
            aspectRatio: "3/4.3",
            borderRadius: 12,
            border: "1.5px dashed #4a4335",
            background: "#211d16",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 8,
            cursor: "pointer",
            overflow: "hidden",
            color: "#8a8168",
          }}
        >
          {cover ? (
            <img src={cover} alt="الغلاف" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          ) : (
            <>
              <ImageIcon size={26} />
              <span style={{ fontSize: 12 }}>إضافة صورة غلاف</span>
            </>
          )}
        </button>
        <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />

        <input
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          placeholder="اسم الرواية"
          dir="rtl"
          style={{
            width: "100%",
            maxWidth: 320,
            marginTop: 24,
            padding: "13px 14px",
            borderRadius: 10,
            border: "1px solid #3a3427",
            background: "#1c1911",
            color: "#EDE6D6",
            fontSize: 15,
            outline: "none",
          }}
        />

        <button
          onClick={handleSave}
          disabled={!title.trim() || busy}
          style={{
            width: "100%",
            maxWidth: 320,
            marginTop: 20,
            padding: "13px 0",
            borderRadius: 10,
            border: "none",
            background: title.trim() ? "#C9A227" : "#3a3427",
            color: title.trim() ? "#181510" : "#8a8168",
            fontSize: 15,
            fontWeight: 700,
            cursor: title.trim() ? "pointer" : "default",
          }}
        >
          {busy ? "جارٍ الحفظ..." : "حفظ"}
        </button>
      </div>
    </div>
  );
}

/* ======================== محرر الفصل (إضافة/تعديل) ======================== */
function ChapterEditor({ initial, nextNumber, onBack, onSave }) {
  const [number, setNumber] = useState(initial ? initial.number : nextNumber);
  const [title, setTitle] = useState(initial ? initial.title || "" : "");
  const [content, setContent] = useState(initial ? initial.content || "" : "");
  const [savedFlash, setSavedFlash] = useState(false);
  const autoSaveTimer = useRef(null);
  const isEdit = !!initial;

  const doSave = useCallback(
    async (silent) => {
      await onSave({ number: Number(number) || 1, title: title.trim(), content });
      if (!silent) {
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 1200);
      }
    },
    [number, title, content, onSave]
  );

  useEffect(() => {
    if (!isEdit) return;
    if (autoSaveTimer.current) clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current = setTimeout(() => {
      doSave(true);
    }, 2500);
    return () => clearTimeout(autoSaveTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [content, title, number]);

  return (
    <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh" }}>
      <TopBar
        title={isEdit ? "تعديل الفصل" : "فصل جديد"}
        onBack={onBack}
        actions={
          <button
            onClick={() => doSave(false)}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 5,
              background: "#C9A227",
              border: "none",
              borderRadius: 8,
              padding: "7px 12px",
              color: "#181510",
              fontSize: 13,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            <Check size={14} />
            حفظ
          </button>
        }
      />

      <div style={{ padding: "16px 18px 8px", display: "flex", gap: 10 }}>
        <input
          type="number"
          value={number}
          onChange={(e) => setNumber(e.target.value)}
          placeholder="رقم الفصل"
          style={{
            width: 90,
            padding: "10px 10px",
            borderRadius: 8,
            border: "1px solid #3a3427",
            background: "#1c1911",
            color: "#EDE6D6",
            fontSize: 14,
            textAlign: "center",
          }}
        />
        <input
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          placeholder="عنوان الفصل (اختياري)"
          dir="rtl"
          style={{
            flex: 1,
            padding: "10px 12px",
            borderRadius: 8,
            border: "1px solid #3a3427",
            background: "#1c1911",
            color: "#EDE6D6",
            fontSize: 14,
          }}
        />
      </div>

      <textarea
        value={content}
        onChange={(e) => setContent(e.target.value)}
        placeholder="ابدأ الكتابة هنا..."
        dir="auto"
        style={{
          flex: 1,
          margin: "10px 18px 24px",
          padding: "16px 4px",
          border: "none",
          borderTop: "1px solid #2a2519",
          background: "transparent",
          color: "#EAE2CC",
          fontSize: 17,
          lineHeight: 2,
          fontFamily: "Georgia, 'Traditional Arabic', 'Noto Naskh Arabic', serif",
          resize: "none",
          outline: "none",
          minHeight: "55vh",
        }}
      />

      <div
        style={{
          position: "fixed",
          bottom: savedFlash ? 20 : -40,
          left: "50%",
          transform: "translateX(-50%)",
          background: "#2c2818",
          border: "1px solid #C9A227",
          color: "#C9A227",
          fontSize: 12.5,
          padding: "8px 16px",
          borderRadius: 20,
          transition: "bottom 0.25s ease",
          display: "flex",
          alignItems: "center",
          gap: 6,
        }}
      >
        <Check size={13} /> تم الحفظ
      </div>
    </div>
  );
}

/* ======================== التطبيق الرئيسي ======================== */
function App() {
  const [loading, setLoading] = useState(true);
  const [novels, setNovels] = useState([]);
  const [chaptersCache, setChaptersCache] = useState({});
  const [view, setView] = useState("library");
  const [currentNovelId, setCurrentNovelId] = useState(null);
  const [currentChapterId, setCurrentChapterId] = useState(null);

  useEffect(() => {
    (async () => {
      const n = await loadNovels();
      setNovels(n);
      setLoading(false);
    })();
  }, []);

  async function openNovel(id) {
    setCurrentNovelId(id);
    if (!chaptersCache[id]) {
      const ch = await loadChapters(id);
      setChaptersCache((prev) => ({ ...prev, [id]: ch }));
    }
    setView("novel");
  }

  async function handleAddNovel({ title, cover }) {
    const novel = { id: uid(), title, cover, createdAt: Date.now() };
    const updated = [novel, ...novels];
    setNovels(updated);
    await saveNovels(updated);
    setView("library");
  }

  async function handleDeleteNovel(id) {
    const updated = novels.filter((n) => n.id !== id);
    setNovels(updated);
    await saveNovels(updated);
    await deleteChaptersKey(id);
    setChaptersCache((prev) => {
      const c = { ...prev };
      delete c[id];
      return c;
    });
  }

  async function handleAddChapter({ number, title, content }) {
    const list = chaptersCache[currentNovelId] || [];
    const chapter = { id: uid(), number, title, content, updatedAt: Date.now() };
    const updated = [...list, chapter];
    setChaptersCache((prev) => ({ ...prev, [currentNovelId]: updated }));
    await saveChapters(currentNovelId, updated);
    setView("novel");
  }

  async function handleUpdateChapter(chapterId, { number, title, content }) {
    const list = chaptersCache[currentNovelId] || [];
    const updated = list.map((c) =>
      c.id === chapterId ? { ...c, number, title, content, updatedAt: Date.now() } : c
    );
    setChaptersCache((prev) => ({ ...prev, [currentNovelId]: updated }));
    await saveChapters(currentNovelId, updated);
  }

  async function handleDeleteChapter(chapterId) {
    const list = chaptersCache[currentNovelId] || [];
    const updated = list.filter((c) => c.id !== chapterId);
    setChaptersCache((prev) => ({ ...prev, [currentNovelId]: updated }));
    await saveChapters(currentNovelId, updated);
  }

  const shell = {
    minHeight: "100vh",
    background: "#181510",
    fontFamily: "system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif",
    direction: "rtl",
    maxWidth: 480,
    margin: "0 auto",
    position: "relative",
  };

  if (loading) {
    return (
      <div style={{ ...shell, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ color: "#8a8168", fontSize: 14 }}>جارٍ التحميل...</span>
      </div>
    );
  }

  const currentNovel = novels.find((n) => n.id === currentNovelId);
  const currentChapters = chaptersCache[currentNovelId] || [];
  const currentChapter = currentChapters.find((c) => c.id === currentChapterId);
  const nextNumber = currentChapters.length
    ? Math.max(...currentChapters.map((c) => c.number)) + 1
    : 1;

  return (
    <div style={shell}>
      {view === "library" && (
        <LibraryView
          novels={novels}
          onOpenNovel={openNovel}
          onAddNovel={() => setView("addNovel")}
          onDeleteNovel={handleDeleteNovel}
        />
      )}

      {view === "addNovel" && <AddNovelView onBack={() => setView("library")} onSave={handleAddNovel} />}

      {view === "novel" && currentNovel && (
        <NovelView
          novel={currentNovel}
          chapters={currentChapters}
          onBack={() => setView("library")}
          onOpenChapter={(id) => {
            setCurrentChapterId(id);
            setView("editChapter");
          }}
          onAddChapter={() => setView("addChapter")}
          onDeleteChapter={handleDeleteChapter}
        />
      )}

      {view === "addChapter" && (
        <ChapterEditor
          initial={null}
          nextNumber={nextNumber}
          onBack={() => setView("novel")}
          onSave={handleAddChapter}
        />
      )}

      {view === "editChapter" && currentChapter && (
        <ChapterEditor
          initial={currentChapter}
          nextNumber={currentChapter.number}
          onBack={() => setView("novel")}
          onSave={(data) => handleUpdateChapter(currentChapter.id, data)}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  // تسجيل الـ Service Worker لتفعيل عمل التطبيق بدون إنترنت
  // (يعمل فقط عند تشغيل الموقع عبر https أو من جهاز محلي عبر خادم، وليس عبر فتح الملف مباشرة)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
